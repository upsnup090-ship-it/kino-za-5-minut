# Источники RSS/Atom. name — человекочитаемое имя, url — адрес фида.
# kind — априорный класс фида для маршрутизации формата (Фаза 2,
# docs/source-routing-design.md §5.1): mixed | video | trailer | boxoffice | archive.
# `mixed` значит «решает классификатор элемента»; `video` — трейлерно-видео-канал.
sources:
  # Пресса — ядро достоверности (первоисточники индустрии).
  - name: Deadline
    url: https://deadline.com/feed/
    kind: mixed
  - name: Variety
    url: https://variety.com/feed/
    kind: mixed
  - name: THR
    url: https://www.hollywoodreporter.com/hq/wp-feed.php?hpnews=movie
    kind: mixed
  - name: SlashFilm
    url: https://www.slashfilm.com/feed/
    kind: mixed
  - name: IndieWire
    url: https://www.indiewire.com/feed/
    kind: mixed
  - name: Guardian
    url: https://www.theguardian.com/film/rss
    kind: mixed
  - name: RollingStone
    url: https://www.rollingstone.com/movies/feed/
    kind: mixed
  - name: AVClub
    url: https://www.avclub.com/rss
    kind: mixed
  # Reddit: только новостные сабреддиты. TrueFilm/marvelstudios/letterboxd
  # убраны 18.10: лонгриды и фан-сабы дублируют прессу, а каждый Reddit-фид
  # под 429-окном съедает минуты прогона.
  # boxoffice здесь остаётся mixed (решение владельца 19.10): классификатор
  # сам вынесет «сборы/касса» в класс boxoffice по маркерам.
  - name: Reddit/movies
    url: https://reddit.com/r/movies/top/.rss?t=day
    kind: mixed
  - name: Reddit/boxoffice
    url: https://reddit.com/r/boxoffice/top/.rss?t=day
    kind: mixed
  # YouTube: официальные трейлерные каналы — кормушка форматов trailer/video.
  # С боевого сервера RSS живые (в песочнице был SSLError — отсюда старое
  # удаление 4b3e777; на сервере фиды отдают по 15 записей).
  - name: YT/IGN
    url: https://www.youtube.com/feeds/videos.xml?channel_id=UCKy1dAqELo0zrOtPkf0eTMw
    kind: video
  - name: YT/SonyPicturesTV
    url: https://www.youtube.com/feeds/videos.xml?channel_id=UCghNDC2eT10D3TsiB2ooWow
    kind: video
  - name: YT/A24
