# Проверка типов: make typecheck
# Цель — не «строгость ради строгости», а отлов реальных багов вроде
# publish(kind="poll", poll_options=None) (docs/todo.md #45).
[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
show_error_codes = True
# scripts/ и tests/ лежат без __init__.py: без этого флага mypy видит
# scripts/routing_report.py дважды (как routing_report и scripts.routing_report).
explicit_package_bases = True
mypy_path = .

# Боевой код — строго: неявный Any в сигнатурах ловится.
[mypy-kino.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_return_any = True

# Тесты и скрипты — мягче: фикстуры pytest и ad-hoc отчёты не стоят
# аннотирования каждой строки, но ошибки типов в них всё равно видны.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-scripts.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
