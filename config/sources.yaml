    url: https://deadline.com/feed/
  - name: Variety
    url: https://variety.com/feed/
  - name: THR
    url: https://www.hollywoodreporter.com/hq/wp-feed.php?hpnews=movie
  - name: SlashFilm
    url: https://www.slashfilm.com/feed/
  - name: IndieWire
    url: https://www.indiewire.com/feed/
  - name: Guardian
    url: https://www.theguardian.com/film/rss
  - name: RollingStone
    url: https://www.rollingstone.com/movies/feed/
  - name: AVClub
    url: https://www.avclub.com/rss
  # Reddit: только новостные сабреддиты. TrueFilm/marvelstudios/letterboxd
  # убраны 18.10: лонгриды и фан-сабы дублируют прессу, а каждый Reddit-фид
  # под 429-окном съедает минуты прогона.
  - name: Reddit/movies
    url: https://reddit.com/r/movies/top/.rss?t=day
  - name: Reddit/boxoffice
    url: https://reddit.com/r/boxoffice/top/.rss?t=day
  # YouTube: официальные трейлерные каналы — кормушка форматов trailer/video.
