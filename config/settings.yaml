# Общие настройки пайплайна.
collect:
  timeout_seconds: 15
  snippet_length: 300
  freshness_days: 48
  top_n: 25
  allow_stale_fallback: true
  # Reddit и ряд сайтов блокируют ботов по User-Agent — нужен браузерный.
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
  max_workers: 6
  # Reddit держит окно лимита на IP (~60с) и режет www-хост: фиды идут
  # последовательно с паузой, а при 429 берётся последний удачный кэш
  # (data/feed_cache). Иначе 4 фида из 5 терялись на каждом прогоне.
  reddit_pause_seconds: 3

choose:
  window_size: 10
  state_max_links: 120
  state_max_signatures: 60

llm:
  draft:
    temperature: 0.75
    # Базовый бюджет черновика. Точный лимит выбирается в коде по формату
    # (_FORMAT_BUDGETS в draft.py): короткие 4096, средние 6144, длинные 8192.
    # Это значение — фолбэк, если формат неизвестен.
    # gemini-3.8-flash не тратит токены на reasoning, поэтому бюджета хватает
    # с запасом; при обрезке draft.py повторяет запрос с большим лимитом.
    max_tokens: 4096
    top_p: 0.9
  judge:
    temperature: 0.1
    # Та же защита: 4096 → 16384, затем фолбэк-модель (JUDGE_FALLBACK_MODEL).
    max_tokens: 4096
  # Reasoning-модель тратила на reasoning до ~14k символов и отвечала медленно.
  # 60с было мало: тяжёлый черновик упирался в таймаут на второй попытке.
  # 120с даёт одной попытке закончить; общий бюджет всё равно режет deadline.
  timeout_seconds: 120

providers:
  apimart:
    base_url: "https://api.apimart.ai/v1"
    api_key: "${APIMART_API_KEY}"
    # gemini-3.8-flash — НЕ reasoning-модель ($0.6/$3.0 за млн): весь бюджет
    # уходит на JSON, а не на скрытые «мысли». Прошлый glm-5.3-flash был
    # reasoning-моделью (5900–10464 символа reasoning) и резал черновик.
    # Судья: deepseek-v4-flash $0.1714/$0.5143 — дешёвый и без reasoning.
    draft_model: "gemini-3.8-flash"
    judge_model: "deepseek-v4-flash"
  gemini:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key: "${GEMINI_API_KEY}"
    draft_model: "gemini-3.8-flash"
    judge_model: "gemini-3.8-flash"
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENROUTER_API_KEY}"
    draft_model: "openai/gpt-4o-mini"
    judge_model: "openai/gpt-4o-mini"
  openai:
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"
    draft_model: "gpt-4o-mini"
    judge_model: "gpt-4o-mini"
  groq:
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
    draft_model: "llama-3.1-70b-versatile"
    judge_model: "llama-3.1-70b-versatile"

models:
  draft: "gemini-3.8-flash"
  judge: "deepseek-v4-flash"

wiki:
  timeout_seconds: 15
  user_agent: "KinoZa5Minut/1.0"

horizon:
  source: rss            # rss | horizon — источник новостей
  dir: horizon           # путь к клону Horizon (относительно корня проекта)
  summaries_dir: data/summaries   # куда Horizon кладёт .md (относительно dir)
  run: true              # запускать `uv run horizon` перед чтением дайджеста
  hours: 24              # окно новостей для Horizon
  timeout_seconds: 600   # таймаут запуска Horizon

# Вариации поста и их веса (случайный выбор при каждом запуске).
# photo — фото с подписью; link — пост-ссылка с превью новости/видео;
# article — статья на graph.org, уходит постом-ссылкой на неё.
post_variations:
  photo: 35
  link: 20
  article: 10
  text: 15
  poll: 10
  gallery: 10

retry:
  max_attempts: 5      # Максимум попыток при 429/сетевых ошибках
  backoff_seconds: 2   # Базовое время ожидания (секунды)
  reddit_max_attempts: 2  # Reddit — укороченная серия: его 429-окно (~60с)
                          # всё равно не закрывается двумя ретраями, а пять
                          # попыток × 20с выедали минуты у LLM-фазы

caption:
  max_length: 950
  hard_limit: 1000

publish:
  parse_mode: HTML
  timeout_seconds: 30

run:
  # Бюджет времени на один пост: сбор + два вызова LLM + картинка + публикация.
  # Reasoning-модель медленная: тяжёлый черновик до 120с, судья до 120с.
  # 300с (5 мин) даёт запас, но всё равно режет зависший источник/LLM.
  # Если не успели — прогон завершается soft (RunResult.aborted), а публикация
  # готового поста не отменяется.
  deadline_seconds: 300

schedule:
  # Окна публикации в локальном времени. "11:00-18:00" — интервал,
  # "22:50" — точное время (один пост ровно в эту минуту).
  windows:
    - "11:00-18:00"
    - "22:50"
  max_posts_per_day: 3
  # Минимальный интервал между постами. Автоматика растягивает его под окно
  # (длина_окна / постов_в_окне), этот параметр — жёсткий пол.
  min_gap_minutes: 45
  timezone: "Europe/Moscow"
  # Как часто serve проверяет расписание (секунды).
  tick_seconds: 60

logging:
  level: INFO              # DEBUG для отладки без правки кода
  file: logs/kino.log
  max_bytes: 5242880       # 5 МБ — порог ротации активного файла
  backup_count: 5          # сколько ротированных версий держать
  console: true            # дублировать в stdout (systemd/journald)
  # Автоочистка обязательна: возраст + размер. Один механизм не покрывает всё
  # (редко-но-долго / всплеск-за-час).
  retention_days: 14       # файлы старше — удалять
  max_total_bytes: 104857600   # 100 МБ на весь каталог логов
  purge_interval_hours: 24 # как часто чистить в цикле serve